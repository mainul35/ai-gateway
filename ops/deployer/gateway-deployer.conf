# /etc/default/gateway-deployer - settings for ops/deployer/gateway-deployer.sh on proxy-vm.
# Changes apply on the next run (every 2 minutes); nothing needs restarting.

# What gets deployed: every commit on this branch whose CI passed
REPO=mainul35/ai-gateway
BRANCH=develop

# The gateway server, reached by ssh with a key (see docs/deployment.md, "One-time setup")
GATEWAY_SSH=mainul35@192.168.50.146
GATEWAY_DIR=model-gateway
PUBLIC_URL=https://ai-gateway.mainul35.dev

# 1: deploy only commits whose GitHub checks passed. 0: deploy every commit.
REQUIRE_CI=1
CI_WAIT_MINUTES=30
