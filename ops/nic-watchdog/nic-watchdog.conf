# /etc/default/nic-watchdog - settings for nic-watchdog (ops/nic-watchdog/nic-watchdog.sh)

# The network card, by hardware address (ip link): its name changed once (enp3s0 -> enp4s0) and
# broke everything that named it
NIC_MAC=a8:a1:59:9d:f4:ae
# Its PCI address (lspci | grep -i ethernet), used when it has dropped off the bus entirely
NIC_PCI=0000:04:00.0

# After a wake: seconds to wait for a link before resetting the card
LINK_WAIT_SEC=40
# Every minute: minutes without a link before a reset, and before a reboot
DEAD_CHECKS_BEFORE_RESET=2
DEAD_CHECKS_BEFORE_REBOOT=5
# At most this many reboots by the watchdog in this many minutes
MAX_REBOOTS=3
REBOOT_WINDOW_MIN=360

# 1: only log what it would do
DRY_RUN=0
