# /etc/default/idle-shutdown — overrides for /usr/local/sbin/idle-shutdown

# Leave at 1 for the first night or two, read the journal, then set to 0.
DRY_RUN=1

# Act after this many minutes with no busy signal.
IDLE_MINUTES=5

# The timer runs every minute (idle-shutdown.timer); keep this in step with it.
CHECK_INTERVAL_SECONDS=60

# Warning before suspending; anything busy in this window cancels it.
WARN_SECONDS=30

# suspend: about 5 W asleep, back in seconds with models still loaded. poweroff: about 1-2 W, but a
# full boot (~1-2 min) on every wake. Check `cat /sys/power/mem_sleep` shows [deep] before using suspend.
ACTION=suspend

# Ask the gateway whether it is working (coding tasks, playground jobs, requests in flight).
# It sees the gaps GPU and CPU numbers miss, e.g. a coding task waiting between model calls.
CHECK_GATEWAY=1
GATEWAY_URL=http://127.0.0.1:9000
GATEWAY_RECENT_SECONDS=90

GPU_UTIL_MAX=10
LOAD_MAX=2.0
NET_KBPS_MAX=500
SESSION_IDLE_MAX_MIN=5

# Off: homelabai keeps Ollama models loaded permanently (OLLAMA_KEEP_ALIVE=-1), so a loaded model
# says nothing about whether anyone is using it. GPU utilisation and the gateway check catch real use.
CHECK_OLLAMA=0
OLLAMA_URL=http://127.0.0.1:11434

# Space-separated exact process names that mean "don't shut down".
# Add long-running job runners here (e.g. opencode, make). Not llama-server: the gateway keeps
# engines loaded for an hour after use, and the gateway check already covers their requests.
# Not "unattended-upgr": Ubuntu keeps unattended-upgrade-shutdown running all the time, and its
# name matches, so the machine would never look idle. Real upgrades still show up as apt/dpkg.
BUSY_PROCESSES="apt apt-get dpkg rsync"

INHIBIT_FILE=/run/stay-awake
