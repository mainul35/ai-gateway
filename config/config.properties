# Ollama Model Checker configuration
#
# Format: key=value. Lines starting with # are comments.
# Changes are picked up automatically; no restart needed.
# A value set here takes precedence over the matching environment variable (shown in brackets).

# Ollama server that models are deployed to, pulled into, listed from and deleted from [OLLAMA_HOST].
# Examples:
#   http://192.168.1.50:11434          Ollama on another machine
#   http://host.docker.internal:11434  Ollama on the same machine that runs the Docker container
#   http://localhost:11434             Ollama on the same machine, app not running in Docker
ollama.host=http://localhost:11434

# HuggingFace token, only needed for gated or private models [HF_TOKEN].
hf.token=

# Hardware of the Ollama server, used for the quantization recommendations
# [OLLAMA_SERVER_VRAM_GB, OLLAMA_SERVER_RAM_GB].
# Leave empty to use the hardware detected where this app runs. Set them when the app runs somewhere
# else than Ollama, e.g. in Docker, where only the container is visible. Use 0 VRAM for a CPU-only server.
ollama.server.vram.gb=
ollama.server.ram.gb=

# --- Gateway (OpenAI-compatible API) ---
# Admin key for /admin endpoints [GATEWAY_MASTER_KEY]. Generated at startup and logged if left empty.
gateway.master.key=

# Database for users, API keys and usage [GATEWAY_DATABASE_URL].
gateway.database.url=

# Extra model routes; every Ollama model is exposed automatically [GATEWAY_MODELS_FILE].
gateway.models.file=config/models.yaml

# --- Single sign-on (OAuth2 authorization code + PKCE) ---
# Public URL of this gateway; the OAuth2 redirect URI is <public url>/auth/callback [GATEWAY_PUBLIC_URL].
gateway.public.url=

# Signs login sessions; generate with: openssl rand -base64 32 [GATEWAY_SESSION_SECRET].
# Left empty a random one is used, which signs everyone out whenever the gateway restarts.
gateway.session.secret=

# VSD auth server (same endpoints LiteLLM uses today) [SSO_CLIENT_ID, SSO_CLIENT_SECRET, ...].
sso.client.id=
sso.client.secret=
sso.authorize.url=https://vsdauthserver.visualsitedesigner.com/oauth2/authorize
sso.token.url=https://vsdauthserver.visualsitedesigner.com/oauth2/token
sso.userinfo.url=https://vsdauthserver.visualsitedesigner.com/userinfo
sso.scope=openid profile email

# Which claims carry identity, and who becomes an admin (comma-separated emails).
sso.claim.id=sub
sso.claim.email=email
sso.claim.name=name
sso.admin.emails=
