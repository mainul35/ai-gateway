# llama.cpp engine profiles: one llama-server process per entry, started on demand.
#
# These are the knobs Ollama does not expose. The important ones for a 24 GB card:
#   n_gpu_layers  999 puts every layer on the GPU; lower it only if nothing else fits
#   n_cpu_ffn     keeps the dense FFN weights of the first N layers on the CPU (llama.cpp b10645+).
#                 Prefer this over lowering n_gpu_layers: attention and the KV cache stay on the GPU,
#                 and only the big FFN matmuls move, which costs far less speed per GB freed.
#   n_cpu_moe     same idea for MoE expert weights
#   cache_type_k/v  q8_0 roughly halves KV cache VRAM versus f16 (needs flash_attn)
#   ctx_size      the KV cache grows linearly with this; it is usually what pushes a model off the GPU
#   ttl_seconds   unload after this long idle; exclusive models stop each other to free VRAM
#
# model_path can point straight at Ollama's blob files, so no model is downloaded twice.

start_port: 8090

defaults:
  ctx_size: 16384
  cache_type_k: q8_0
  cache_type_v: q8_0
  flash_attn: true
  ttl_seconds: 3600   # keep loaded for an hour; a cold start costs ~15s
  exclusive: true

models:
  # Measured on a 24 GB RTX 3090 (2026-09-17), all layers on GPU:
  #   ctx 8192 -> 17.4 GB | ctx 65536 -> 19.5 GB | ctx 131072 -> 22.0 GB | ctx 65536 f16 KV -> 21.3 GB
  #   generation 42.5 t/s, prefill ~1340 t/s at pp512/pp2048. Ollama matches the speed but cannot
  #   set context or KV type per model, which is what this profile buys.
  - name: qwen3.8-27b-tuned
    parameter_size: 27.3B
    model_path: /usr/share/ollama/.ollama/models/blobs/sha256-3e020514545c310dfc511dc8d3ddc23482b645189cb9287816d84bed6eddd4ac
    n_gpu_layers: 999
    ctx_size: 65536
    # Chat clients resend the whole conversation each turn; reusing the cached prefix saves the re-read
    cache_reuse: 256
    # Qwen3.8 is a thinking model: by default it emits reasoning tokens before any visible answer,
    # which looks like a hang in clients that only render "content". Off by default; a client can
    # re-enable it per request with chat_template_kwargs {"enable_thinking": true}.
    chat_template_kwargs: '{"enable_thinking": false}' 
    # Headroom left over: ~4 GB. For 128k context set ctx_size 131072 (22.0 GB, tight).
    # For better KV quality at 64k use cache_type_k/v f16 (21.3 GB).

  # 80B MoE (3B active, 46 GB) that does not fit in 24 GB. n_gpu_layers is left unset so
  # llama-server's --fit fills the 3090 (~22.7 GB) and keeps the remaining experts in this machine's
  # RAM; with 3B active per token that costs little.
  # Measured 2026-10-03, ctx 32768, q8_0 KV:
  #   3090 + RAM here:                      41.5-49.2 t/s generation, 206 t/s prompt, 48 s load
  #   3090 + laptop A4000 over llama.cpp RPC: 3.2 t/s generation, 102 t/s prompt, 121 s load
  # So no --rpc here: the network split is ~13x slower for this model. The laptop's RPC server
  # (192.168.50.52:50052) is still up if a dense model that needs the extra VRAM comes along.
  # Context, measured 2026-10-03 (22.7 GB on the 3090 in every case; most layers are linear
  # attention with no KV cache, so context is cheap):
  #   32k/64k:  42-45 t/s generation, ~450 t/s prompt
  #   128k:     25 t/s on a short reply, 33 t/s at 104k tokens; 506 t/s prompt - a 104k-token
  #             conversation takes 205 s to read once, and its next turn 5 s, from the prompt cache
  # 128k, for long chats in desktop clients (Qwen Code through ACP UI). Reading a long conversation
  # cold takes longer than Cloudflare allows a silent request; streamed requests are kept alive with
  # SSE comments while that happens (app/routers/openai_v1.py, _streamed).
  # 256k since the RAM went to 45 GB (2026-10-16): the experts that do not fit on the 3090 now stay
  # in RAM instead of being read back from disk. Measured with --fit, q8_0 KV, no prompt cache:
  #    47k tokens: 618 t/s prompt (77 s),  40.4 t/s generation
  #    95k tokens: 590 t/s prompt (161 s), 35.9 t/s generation
  #   178k tokens: 546 t/s prompt (325 s), 29.5 t/s generation          22.9 GB VRAM throughout
  - name: qwen3-next-80b
    parameter_size: 80B
    model_path: /home/mainul35/models/Qwen3-Next-80B-A3B-Instruct-UD-Q4_K_XL.gguf
    ctx_size: 262144
    cache_reuse: 256

  # qwen3.6 (35B MoE, 3B active, hybrid attention, vision) with a long window: the fastest model here
  # for long work. The llama-b11025 build cannot load its architecture, so these run Ollama's own,
  # newer llama-server on Ollama's file; vision comes from the same file (--mmproj on it works: the
  # server translates Ollama's format). Ollama's build needs to be told where its CUDA backend is.
  # Measured 2026-10-16 with --fit (experts it cannot place stay in RAM), q8_0 KV, no prompt cache:
  #   256k window:  47k tokens 2658 t/s prompt (18 s),  86.6 t/s generation
  #                 95k tokens 2239 t/s prompt (42 s),  66.7 t/s
  #                178k tokens 1753 t/s prompt (101 s), 49.9 t/s           23.0 GB VRAM
  #   1M window (YaRN x4 past the trained 256k):
  #                178k tokens 1217 t/s prompt (146 s), 33.9 t/s
  #                356k tokens  911 t/s prompt (6.5 min), 24.7 t/s
  #                519k tokens  734 t/s prompt (12 min), 19.9 t/s
  #                741k tokens  579 t/s prompt (21 min), 15.5 t/s           23.1 GB VRAM, 23+ GB RAM free
  # The 1M profile is slower at every length (its bigger cache leaves less of the model on the GPU)
  # and YaRN stretching costs a little quality on short work: use it only for what needs > 256k.
  - name: qwen3.6-256k
    parameter_size: 36B
    model_path: /usr/share/ollama/.ollama/models/blobs/sha256-f5ee307a2982106a6eb82b62b2c00b575c9072145a759ae4660378acda8dcf2d
    mmproj: /usr/share/ollama/.ollama/models/blobs/sha256-f5ee307a2982106a6eb82b62b2c00b575c9072145a759ae4660378acda8dcf2d
    binary: /usr/local/lib/ollama/llama-server
    env: {LD_LIBRARY_PATH: "/usr/local/lib/ollama:/usr/local/lib/ollama/cuda_v13",
          GGML_BACKEND_PATH: /usr/local/lib/ollama/cuda_v13/libggml-cuda.so}
    ctx_size: 262144
    cache_reuse: 256
    extra_args: ["--fit", "on"]

  - name: qwen3.6-1m
    parameter_size: 36B
    model_path: /usr/share/ollama/.ollama/models/blobs/sha256-f5ee307a2982106a6eb82b62b2c00b575c9072145a759ae4660378acda8dcf2d
    mmproj: /usr/share/ollama/.ollama/models/blobs/sha256-f5ee307a2982106a6eb82b62b2c00b575c9072145a759ae4660378acda8dcf2d
    binary: /usr/local/lib/ollama/llama-server
    env: {LD_LIBRARY_PATH: "/usr/local/lib/ollama:/usr/local/lib/ollama/cuda_v13",
          GGML_BACKEND_PATH: /usr/local/lib/ollama/cuda_v13/libggml-cuda.so}
    ctx_size: 1048576
    cache_reuse: 256
    # The server caps a window at the length the file says the model was trained for (256k) unless
    # told otherwise: hence the override, besides YaRN itself
    extra_args: ["--fit", "on", "--rope-scaling", "yarn", "--rope-scale", "4", "--yarn-orig-ctx", "262144",
                 "--override-kv", "qwen35moe.context_length=int:1048576"]
