# llama.cpp engine profiles: one llama-server process per entry, started on demand.
#
# These are the knobs Ollama does not expose. The important ones for a 24 GB card:
#   n_gpu_layers  999 puts every layer on the GPU; lower it only if nothing else fits
#   n_cpu_ffn     keeps the dense FFN weights of the first N layers on the CPU (llama.cpp b10645+).
#                 Prefer this over lowering n_gpu_layers: attention and the KV cache stay on the GPU,
#                 and only the big FFN matmuls move, which costs far less speed per GB freed.
#   n_cpu_moe     same idea for MoE expert weights
#   cache_type_k/v  q8_0 roughly halves KV cache VRAM versus f16 (needs flash_attn)
#   ctx_size      the KV cache grows linearly with this; it is usually what pushes a model off the GPU
#   ttl_seconds   unload after this long idle; exclusive models stop each other to free VRAM
#
# model_path can point straight at Ollama's blob files, so no model is downloaded twice.

start_port: 8090

defaults:
  ctx_size: 16384
  cache_type_k: q8_0
  cache_type_v: q8_0
  flash_attn: true
  ttl_seconds: 3600   # keep loaded for an hour; a cold start costs ~15s
  exclusive: true

models:
  # 80B MoE (3B active, 46 GB) that does not fit in 24 GB. n_gpu_layers is left unset so
  # llama-server's --fit fills the 3090 (~22.7 GB) and keeps the remaining experts in this machine's
  # RAM; with 3B active per token that costs little.
  # Measured 2026-10-03, ctx 32768, q8_0 KV:
  #   3090 + RAM here:                      41.5-49.2 t/s generation, 206 t/s prompt, 48 s load
  #   3090 + laptop A4000 over llama.cpp RPC: 3.2 t/s generation, 102 t/s prompt, 121 s load
  # So no --rpc here: the network split is ~13x slower for this model. The laptop's RPC server
  # (192.168.50.52:50052) is still up if a dense model that needs the extra VRAM comes along.
  # Context, measured 2026-10-03 (22.7 GB on the 3090 in every case; most layers are linear
  # attention with no KV cache, so context is cheap):
  #   32k/64k:  42-45 t/s generation, ~450 t/s prompt
  #   128k:     25 t/s on a short reply, 33 t/s at 104k tokens; 506 t/s prompt - a 104k-token
  #             conversation takes 205 s to read once, and its next turn 5 s, from the prompt cache
  # 128k, for long chats in desktop clients (Qwen Code through ACP UI). Reading a long conversation
  # cold takes longer than Cloudflare allows a silent request; streamed requests are kept alive with
  # SSE comments while that happens (app/routers/openai_v1.py, _streamed).
  # 256k since the RAM went to 45 GB (2026-10-16): the experts that do not fit on the 3090 now stay
  # in RAM instead of being read back from disk. Measured with --fit, q8_0 KV, no prompt cache:
  #    47k tokens: 618 t/s prompt (77 s),  40.4 t/s generation
  #    95k tokens: 590 t/s prompt (161 s), 35.9 t/s generation
  #   178k tokens: 546 t/s prompt (325 s), 29.5 t/s generation          22.9 GB VRAM throughout
  - name: qwen3-next-80b
    parameter_size: 80B
    model_path: /home/mainul35/models/Qwen3-Next-80B-A3B-Instruct-UD-Q4_K_XL.gguf
    ctx_size: 262144
    cache_reuse: 256
    # One request at a time, each with the whole window. With several slots llama-server shares ONE
    # window between them: three of Claude Desktop's agents working at once ran out of it together
    # ("Context size has been exceeded", 2026-10-18) though no conversation was near the limit. A
    # request that arrives while another is answered now waits its turn instead.
    parallel: 1
    # Conversations waiting their turn, or set aside for another, resume from RAM, not from scratch
    extra_args: ["--cache-ram", "24576"]

  # qwen3.6 (35B MoE, 3B active, hybrid attention, vision): the coding model here since 2026-10-18.
  # Compared that day with Ornith 35B-A3B and Qwen3.8-27B + MTP on 12 coding tasks with hidden tests
  # and 3 tool-call checks: all three passed 11/12, and qwen3.6 is the one that also reads screenshots
  # and keeps above 50 t/s across most of a 256K window, so agents need no second model for images.
  # Unsloth's UD-Q4_K_XL file (it carries MTP layers, unused: on this MoE the draft context does not
  # fit beside a 256K cache and the image reader, and MTP buys a MoE little), with its own vision
  # projector. The llama-b11025 build cannot load this architecture, so these run Ollama's newer
  # llama-server, which needs to be told where its CUDA backend is.
  # Measured 2026-10-18 on this file, real code as the prompt, code as the answer, q8_0 KV:
  #   256k window:   1.6k tokens  104 t/s generation
  #                  100k tokens 1450 t/s prompt (69 s), 66 t/s;  next turn from the prompt cache 0.2 s
  # Measured 2026-10-16 on Ollama's copy of the same model:
  # Measured 2026-10-16 with --fit (experts it cannot place stay in RAM), q8_0 KV, no prompt cache:
  #   256k window:  47k tokens 2658 t/s prompt (18 s),  86.6 t/s generation
  #                 95k tokens 2239 t/s prompt (42 s),  66.7 t/s
  #                178k tokens 1753 t/s prompt (101 s), 49.9 t/s           23.0 GB VRAM
  #   1M window (YaRN x4 past the trained 256k):
  #                178k tokens 1217 t/s prompt (146 s), 33.9 t/s
  #                356k tokens  911 t/s prompt (6.5 min), 24.7 t/s
  #                519k tokens  734 t/s prompt (12 min), 19.9 t/s
  #                741k tokens  579 t/s prompt (21 min), 15.5 t/s           23.1 GB VRAM, 23+ GB RAM free
  # The 1M profile is slower at every length (its bigger cache leaves less of the model on the GPU)
  # and YaRN stretching costs a little quality on short work: use it only for what needs > 256k.
  # On llama-b11836 with MTP since 2026-10-24 (two 3090s): the file carries the MTP layer, so the engine
  # drafts two tokens ahead (mtp: auto) - 88-92 % of the drafts kept, the same output, writing 1.7-1.9x
  # faster than Ollama's build without it (600 tokens of code back, writing / reading, 31 GB):
  #     1.6k tokens  207 t/s (was 124)      51k tokens  163 t/s (was 90)      102k tokens  136 t/s (was 70)
  #   reading 2.7-3.3k t/s either way. b11836 reads qwen35moe, which b11025 did not.
  - name: qwen3.6-256k
    parameter_size: 36B
    model_path: /home/mainul35/models/Qwen3.6-35B-A3B-MTP-UD-Q4_K_XL.gguf
    mmproj: /home/mainul35/models/Qwen3.6-35B-A3B-mmproj-F16.gguf
    binary: /home/mainul35/llama.cpp/llama-b11836/llama-server
    ctx_size: 262144
    cache_reuse: 256
    # One request at a time, each with the whole window. With several slots llama-server shares ONE
    # window between them: three of Claude Desktop's agents working at once ran out of it together
    # ("Context size has been exceeded", 2026-10-18) though no conversation was near the limit. A
    # request that arrives while another is answered now waits its turn instead.
    parallel: 1
    # --fit fills the GPU but for a margin, and the image reader is loaded after it: with the default
    # margin its 248 MB working buffer did not fit ("cudaMalloc failed: out of memory" at every start)
    # and the engine fell over at the first picture - no screenshot pasted into Claude Code was ever
    # read. Measured 2026-10-19, 1280x800 screenshot and 600 tokens of code:
    #   default margin  23.9 GB  picture crashes the engine              87.5 t/s
    #   1536 MiB        23.6 GB  picture read in 2.7 s                  100.9 t/s
    #   2048 MiB        23.1 GB  picture read in 2.9 s                   77.7 t/s
    #   image reader on the CPU (--no-mmproj-offload): 7.6 s a picture,  96.0 t/s
    extra_args: ["--fit", "on", "--fit-target", "1536", "--cache-ram", "24576"]

  - name: qwen3.6-1m
    parameter_size: 36B
    model_path: /home/mainul35/models/Qwen3.6-35B-A3B-MTP-UD-Q4_K_XL.gguf
    mmproj: /home/mainul35/models/Qwen3.6-35B-A3B-mmproj-F16.gguf
    binary: /usr/local/lib/ollama/llama-server
    env: {LD_LIBRARY_PATH: "/usr/local/lib/ollama:/usr/local/lib/ollama/cuda_v13",
          GGML_BACKEND_PATH: /usr/local/lib/ollama/cuda_v13/libggml-cuda.so}
    # Not measured with MTP at a million: its draft cache beside this window is untested, and a window
    # that does not fit fails mid-answer rather than at start, where the fallback could catch it
    mtp: "off"
    ctx_size: 1048576
    cache_reuse: 256
    # One request at a time, each with the whole window (see qwen3.6-256k). With several slots llama-server shares ONE
    parallel: 1
    # The server caps a window at the length the file says the model was trained for (256k) unless
    # told otherwise: hence the override, besides YaRN itself. The margin for the image reader as in
    # qwen3.6-256k (with 1536 MiB: picture read in 4.2 s, 51.8 t/s; without it, a picture crashed it)
    extra_args: ["--fit", "on", "--fit-target", "1536", "--cache-ram", "24576", "--rope-scaling", "yarn", "--rope-scale", "4", "--yarn-orig-ctx", "262144",
                 "--override-kv", "qwen35moe.context_length=int:1048576"]

  # Qwen3.8-Flash-Next GSQ-RCO Coder (ISTA-DASLab; 177B MoE, about 3B active, vision), the second coding
  # model since 2026-10-20: for the bigger tasks, qwen3.6-256k for the quick ones. Only file offered is
  # IQ1_M (1.9 bits a weight): the model in 29.6 GB, plus a 28.8 GB n-gram table llama.cpp keeps in RAM.
  # Its architecture (qwen4exp) loads in llama-b11025, the default binary, and not in Ollama's build.
  # 8 GB of the model does not fit beside a 256K cache on the 3090, so it is slower everywhere:
  #   1.6k tokens  191 t/s prompt,  32.4 t/s generation
  #    51k tokens  285 t/s prompt (3 min),   24.1 t/s
  #   101k tokens  320 t/s prompt (5.3 min), 18.9 t/s; next turn from the prompt cache 0.7 s
  # but it codes better: 11/12 tasks and 3/3 tool checks (qwen3.6: 11/12, 2/3), and on a real multi-file
  # task through Claude Code (count_tokens, 8 hidden tests) 8/8 in 29 min and 45 turns, where qwen3.6
  # got 7/8 in 38 min and 98 turns. A second 3090 would hold all of it and lift the speed.
  - name: qwen3.8-flash-coder
    parameter_size: 177B
    model_path: /home/mainul35/models/qwen3.8-flash-next-coder/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf
    mmproj: /home/mainul35/models/qwen3.8-flash-next-coder/mmproj-Qwen3.8-Flash-Next-BF16.gguf
    ctx_size: 262144
    # One request at a time, each with the whole window (see qwen3.6-256k)
    parallel: 1
    # The image reader's room, as for qwen3.6; conversations set aside resume from RAM
    extra_args: ["--fit", "on", "--fit-target", "1536", "--cache-ram", "24576"]

  # vLLM and SGLang (installed 2026-10-26 in ~/inference, each its own Python 3.12 environment): the
  # same qwen3.6 on both 3090s at once (tensor parallel), from safetensors - AWQ 4-bit
  # (QuantTrio/Qwen3.6-35B-A3B-AWQ, 25.5 GB; the attention, the linear attention, the image reader and
  # the MTP layers stay unquantized). Only 10 of its 40 layers keep a KV cache (2 heads of 256), about
  # 20 KB a token: 256K is 5 GB, so the cache has room for several agents at once. Their ports are set,
  # so the profiles after them keep theirs.
  # vLLM, for agents: tool calls parsed by qwen3_coder, thinking split off by the qwen3 parser, a shared
  # prompt prefix computed once for every request that starts with it.
  - name: qwen3.6-vllm
    server: vllm
    binary: /home/mainul35/inference/vllm-venv/bin/vllm
    model_path: /home/mainul35/models/Qwen3.6-35B-A3B-AWQ
    port: 8120
    parameter_size: 35B
    vision: true
    ctx_size: 262144
    tensor_parallel: 2
    gpu_memory: 0.90
    # Requests answered at once, each with the whole window if the cache has room for it
    parallel: 4
    extra_args: ["--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder", "--reasoning-parser", "qwen3",
                 "--enable-prefix-caching"]

  # SGLang, for the long window: 1M tokens by YaRN x4 past the trained 256K, as qwen3.6-1m does in
  # llama.cpp; the cache in 8 bits (about 10 GB at 1M). SGLang refuses a window past the trained one
  # unless told it may.
  - name: qwen3.6-sglang-1m
    server: sglang
    binary: /home/mainul35/inference/sglang-venv/bin/python
    model_path: /home/mainul35/models/Qwen3.6-35B-A3B-AWQ
    port: 8121
    parameter_size: 35B
    vision: true
    ctx_size: 1048576
    tensor_parallel: 2
    gpu_memory: 0.88
    parallel: 2
    env: {SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: "1"}
    extra_args: ["--tool-call-parser", "qwen3_coder", "--reasoning-parser", "qwen3", "--kv-cache-dtype", "fp8_e5m2",
                 "--json-model-override-args",
                 '{"text_config": {"max_position_embeddings": 1048576, "rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "partial_rotary_factor": 0.25, "rope_theta": 10000000, "rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 262144}}}']
