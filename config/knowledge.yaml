# The gateway's shared sources: what managers and admins (and the playground's agent) can look up,
# split into passages, embedded (pgvector), and searched by meaning and by exact words together.
# People's own repositories are connected per person on the dashboard and are not listed here.
#
# Two kinds of source:
#
#   kind: folder   a directory on this machine. Paths are relative to the gateway's own folder
#                  unless absolute.
#   kind: github   every repository of the named owners, cloned (shallow) into checkout_dir and
#                  refreshed on a schedule. Needs a read-only token in config/config.properties,
#                  which is not in the repository:
#                    knowledge.github.token.<owner>=github_pat_...   one per owner, because a
#                                                                    fine-grained token has one
#                    knowledge.github.token=...                       or one for all of them
#                  Fine-grained, "Contents: read-only" and "Metadata: read-only" is all it needs.
#
# Whatever is indexed can be read back by any manager through the agent. Files that look like they
# hold credentials (.env, keys, *.properties with a password in them...) are never indexed, and a
# passage that matches a credential pattern is dropped, but do not point this at anything you
# would not show a manager.

checkout_dir: /home/mainul35/knowledge/repos

sources:
  # This gateway, as deployed: the code that is actually running
  - name: ai-gateway
    kind: folder
    path: .
    description: This AI model gateway itself - FastAPI app, llama.cpp engine supervisor, playground, SSO

  # GitHub repositories are no longer listed here: each person connects their own on the dashboard
  # (Your projects), with their own token, and they are indexed for that person alone. A kind: github
  # source without a token in config.properties failed on every run, and its failure stopped the
  # removal of sources that had gone. It still works here if one is wanted, with a token.
