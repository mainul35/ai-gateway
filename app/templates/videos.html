{% extends "base.html" %}
{% block title %}Videos &middot; Model Gateway{% endblock %}
{% block body_class %}videos-page{% endblock %}
{% block content %}
<style>
body.videos-page main{max-width:90rem}
.shelf{display:flex;gap:.7rem;overflow-x:auto;padding:.1rem .1rem .5rem;margin-bottom:1.1rem;scrollbar-width:thin}
.shelf button{flex:none;width:190px;text-align:left;background:var(--card);border:1px solid transparent;border-radius:10px;
              padding:.4rem;color:var(--text);cursor:pointer;font-size:.82rem}
.shelf button:hover{border-color:var(--border)}
.shelf button.on{border-color:var(--primary)}
.shelf .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:var(--input);display:block;margin-bottom:.35rem}
.shelf .what{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf .meta{color:var(--muted);font-size:.76rem}
.top{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:1.4rem;align-items:start}
@media (max-width:900px){.top{grid-template-columns:1fr}}
.top video{width:100%;aspect-ratio:16/9;border-radius:12px;background:#000;display:block}
.top h2{font-size:1.35rem;margin:.1rem 0 .25rem;color:var(--text)}
.langs{display:flex;flex-wrap:wrap;gap:.35rem;margin:.8rem 0}
.langs button{background:none;border:1px solid var(--border);border-radius:999px;padding:.2rem .75rem;color:var(--muted);
              cursor:pointer;font-size:.85rem}
.langs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.actions select{width:auto}
.versions{margin-top:.8rem;font-size:.85rem}
.versions summary{cursor:pointer;color:var(--muted)}
.versions li{margin:.3rem 0}
.state-note{margin-top:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.9rem;margin-top:1.4rem}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}}
.scene-card{background:var(--card);border:1px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;
            text-align:left;padding:0;color:var(--text);font:inherit}
.scene-card:hover{border-color:var(--border)}
.scene-card.sel{border-color:var(--primary)}
.scene-card.edited{border-color:#f59e0b}
.scene-card .pic{position:relative}
.scene-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--input)}
.scene-card .n{position:absolute;left:.4rem;top:.4rem;background:rgba(0,0,0,.65);border-radius:6px;padding:0 .45rem;font-size:.75rem}
.scene-card .flag{position:absolute;right:.4rem;top:.4rem;background:#f59e0b;color:#111;border-radius:6px;padding:0 .45rem;
                  font-size:.72rem;font-weight:600}
.scene-card .t{padding:.45rem .6rem 0;font-size:.84rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
               -webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.scene-card .b{padding:.35rem .6rem .55rem;display:flex;flex-wrap:wrap;gap:.3rem}
.badge{font-size:.7rem;border-radius:999px;padding:.05rem .45rem;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.badge.recorded{border-color:#22c55e;color:#4ade80}
.badge.qari{border-color:#8b5cf6;color:#c4b5fd}
.drawer{position:fixed;right:0;top:0;bottom:0;width:31rem;max-width:100vw;background:var(--card);
        border-left:1px solid var(--border);padding:1rem 1.2rem 5rem;overflow-y:auto;z-index:30;
        box-shadow:-12px 0 30px rgba(0,0,0,.45);transform:translateX(105%);transition:transform .2s}
.drawer.open{transform:none}
.drawer .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.drawer .head b{font-size:1rem}
.drawer .close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer}
.drawer img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;cursor:zoom-in;background:var(--input)}
.drawer label.field{display:flex;gap:.45rem;align-items:center;font-size:.8rem;color:var(--muted);margin:.85rem 0 .3rem}
.drawer textarea{width:100%;min-height:5.5rem;resize:vertical;font-family:inherit;font-size:.95rem;line-height:1.55}
.drawer textarea.changed{border-color:var(--primary)}
.drawer .check{display:flex;gap:.45rem;align-items:center;font-size:.85rem;margin-top:.6rem;cursor:pointer}
.drawer .check input{width:auto;margin:0}
.drawer .stale{font-size:.78rem;color:#f59e0b;margin-top:.25rem}
.drawer .nav-row{display:flex;justify-content:space-between;margin-top:1.1rem}
.drawer .describe{min-height:4rem;font-size:.88rem;margin-top:.4rem}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;z-index:40;background:var(--card);
      border:1px solid var(--primary);border-radius:999px;padding:.4rem .45rem .4rem 1rem;display:flex;gap:.8rem;
      align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100vw - 2rem)}
.pill[hidden]{display:none}
.pill .btn{border-radius:999px}
.progress{position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;z-index:40;width:min(36rem,calc(100vw - 2rem));
          background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.75rem 1rem;
          box-shadow:0 8px 30px rgba(0,0,0,.5)}
.progress .line{font-size:.85rem;color:var(--muted)}
.progress .bar{height:6px;background:var(--input);border-radius:3px;overflow:hidden;margin:.3rem 0 .5rem}
.progress .bar div{height:100%;background:var(--primary);width:0;transition:width .3s}
.progress .bar.total{height:4px;margin-bottom:0}
.progress .bar.total div{background:var(--muted)}
dialog.zoom{border:none;background:none;padding:0;max-width:96vw}
dialog.zoom img{max-width:96vw;max-height:90vh;border-radius:8px}
dialog.zoom::backdrop{background:rgba(0,0,0,.8)}
</style>

<div id="error" class="note err" hidden></div>
<div class="shelf" id="shelf"><span class="muted">Loading…</span></div>
<div id="story"><p class="muted">Choose a video story.</p></div>

<aside class="drawer" id="drawer" aria-label="Scene"></aside>
<div class="pill" id="pill" hidden><span id="pillText"></span><button class="btn" id="save">Save and remake</button></div>
<div class="progress" id="progress" hidden><div class="line" id="partLine"></div><div class="bar"><div id="partBar"></div></div>
  <div class="line" id="wholeLine"></div><div class="bar total"><div id="wholeBar"></div></div></div>
<dialog class="zoom" id="zoom"><img alt=""></dialog>

<script src="/static/video_draft.js"></script>
<script>
// The languages a video story can be told in (app/tools/video_story.py LANGUAGES)
const NAMES = {en: 'English', bn: 'বাংলা', es: 'Español', fr: 'Français', zh: '中文', ja: '日本語', ko: '한국어',
               th: 'ไทย', ar: 'العربية', ur: 'اردو', hi: 'हिन्दी'};
const IN_ENGLISH = {en: 'English', bn: 'Bangla', es: 'Spanish', fr: 'French', zh: 'Chinese', ja: 'Japanese',
                    ko: 'Korean', th: 'Thai', ar: 'Arabic', ur: 'Urdu', hi: 'Hindi'};
const BY = {machine: 'machine voice', recorded: 'your voice', qari: 'qari'};
const JSON_HEADERS = {'Content-Type': 'application/json'};
let current = null;          // {message_id, conversation, video, being_made}
let showing = null;          // the language whose video is in the player
let open = null;             // the scene in the side panel
let edits = {};              // scene -> {text: {lang: words}, retranslate, redraw, picture}
let busy = false;

function showError(text){
  const box = document.getElementById('error');
  box.textContent = text || '';
  box.hidden = !text;
}

async function api(path, options){
  const response = await fetch(path, options);
  if(response.status === 401){ location.href = '/login'; throw new Error('signed out'); }
  const body = await response.json().catch(() => ({}));
  if(!response.ok) throw new Error((typeof body.detail === 'string' && body.detail) || `HTTP ${response.status}`);
  return body;
}

async function readEvents(response, onData){
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while(true){
    const {value, done} = await reader.read();
    if(done) break;
    buffer += decoder.decode(value, {stream: true});
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for(const line of lines){
      if(!line.startsWith('data:')) continue;
      let chunk;
      try{ chunk = JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
      if(chunk.error) throw new Error(chunk.error.message || 'It stopped');
      onData(chunk);
    }
  }
}

const story = () => current?.video?.story || {};
const languages = () => current?.video?.languages || Object.keys(current?.video?.videos || {});
const clean = text => (text || '').split(/\s+/).join(' ').trim();

// --- the shelf of stories ---------------------------------------------------------------------

async function loadShelf(){
  const {videos} = await api('/chat/videos');
  const shelf = document.getElementById('shelf');
  if(!videos.length){
    shelf.innerHTML = '<p class="muted">No video stories yet. Make one in the Playground with Video story switched on.</p>';
    return;
  }
  shelf.innerHTML = videos.map(v => `<button type="button" data-id="${v.message_id}"
      class="${current?.message_id === v.message_id ? 'on' : ''}">
      ${v.picture ? `<img class="thumb" src="/chat/files/${v.picture}" alt="" loading="lazy">` : '<span class="thumb"></span>'}
      <span class="what">${escapeHtml(v.title || 'Video story')}</span>
      <span class="meta">${v.scenes || '?'} scenes · ${v.languages.map(l => l.toUpperCase()).join(' ') || '—'}${
        v.state !== 'done' ? ' · ' + escapeHtml(v.state) : ''}</span></button>`).join('');
  shelf.querySelectorAll('button').forEach(b => b.addEventListener('click', () => openStory(Number(b.dataset.id))));
  const wanted = Number(new URLSearchParams(location.search).get('id')) || videos[0].message_id;
  if(!current) openStory(wanted);
}

async function openStory(id){
  if(Object.keys(edits).length && current?.message_id !== id &&
     !confirm('Leave this story? The changes you have not saved will be lost.')) return;
  showError('');
  try{ current = await api(`/chat/videos/${id}`); }catch(e){ showError(e.message); return; }
  history.replaceState(null, '', `/videos?id=${id}`);
  document.querySelectorAll('#shelf button').forEach(b => b.classList.toggle('on', Number(b.dataset.id) === id));
  edits = {};
  closeDrawer();
  const made = Object.keys(current.video.videos || {});
  showing = made.includes(showing) ? showing : made[0] || null;
  render();
}

// --- the story: player, actions, scenes -------------------------------------------------------

function render(){
  // Not made yet: its scenes as text, to read and correct before anything is drawn
  if(current.video.state === 'draft'){
    renderDraft(document.getElementById('story'), current, {showError, readEvents,
      progress: event => event ? showProgress(event) : (document.getElementById('progress').hidden = true),
      reload: async () => { await openStory(current.message_id); loadShelf(); }});
    return;
  }
  const video = current.video;
  const told = story();
  const langs = languages();
  const now = showing && (video.videos || {})[showing];
  const earlier = showing ? ((video.versions || {})[showing] || []) : [];
  const missing = Object.keys(NAMES).filter(l => !langs.includes(l));
  const editable = !!told.pictures && !current.being_made;
  document.getElementById('story').innerHTML = `<div class="top">
      <div>${now ? `<video controls preload="metadata" playsinline src="${escapeHtml(now.url)}"></video>`
                 : '<div class="note">No video made yet.</div>'}</div>
      <div><h2>${escapeHtml(video.title || 'Video story')}</h2>
        <div class="muted">${video.title_bn ? escapeHtml(video.title_bn) + ' · ' : ''}${(told.pictures || []).length || video.scenes || '?'} scenes</div>
        <div class="langs">${Object.keys(video.videos || {}).map(l => `<button type="button" data-lang="${l}" class="${l === showing ? 'on' : ''}">
          ${NAMES[l] || l}${video.videos[l].seconds ? ' · ' + Math.floor(video.videos[l].seconds / 60) + ':' +
            String(Math.round(video.videos[l].seconds % 60)).padStart(2, '0') : ''}${
            video.videos[l].voice ? ' · ' + escapeHtml(video.videos[l].voice === 'recorded' ? 'your voice' : video.videos[l].voice) : ''}</button>`).join('')}</div>
        <div class="actions">
          ${editable && missing.length ? `<select id="addLang"><option value="">＋ Add a language…</option>${
            missing.map(l => `<option value="${l}">${NAMES[l]} · ${IN_ENGLISH[l]}</option>`).join('')}</select>` : ''}
          ${current.conversation ? `<a class="btn btn-secondary" href="/playground?c=${encodeURIComponent(current.conversation)}"
            title="Read a language in your own voice, under the video in its conversation">🎙 Read in your voice</a>` : ''}
        </div>
        ${earlier.length ? `<details class="versions"><summary>⟲ ${earlier.length} earlier ${IN_ENGLISH[showing] || ''} version${earlier.length > 1 ? 's' : ''}</summary><ol>${
          earlier.map(v => `<li>replaced ${escapeHtml((v.replaced_at || '').replace('T', ' '))} ·
            <a href="${escapeHtml(v.url)}" target="_blank" rel="noopener">play</a>
            ${editable ? `<button type="button" class="btn btn-secondary" data-restore="${v.file_id}">Bring back</button>` : ''}</li>`).join('')}</ol></details>` : ''}
        ${current.being_made ? '<div class="note state-note">Being made right now; its scenes can be changed once it is done.</div>' : ''}
        ${video.state && video.state !== 'done' && !current.being_made ? `<div class="note state-note">It stopped partway${
          video.paused ? ': ' + escapeHtml(video.paused) : ''}. What it made is kept.
          <button type="button" class="btn btn-secondary" id="carryOn">Continue from where it stopped</button></div>` : ''}
        ${!told.pictures ? '<div class="note state-note">Made before its scenes were kept, so it cannot be edited; make it again to edit it.</div>' : ''}
      </div></div>
    <div class="grid" id="grid"></div>`;
  renderGrid();

  document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => { showing = b.dataset.lang; render(); }));
  document.getElementById('addLang')?.addEventListener('change', e => {
    const lang = e.target.value;
    if(lang && confirm(`Translate this story into ${IN_ENGLISH[lang]} and make its video? No picture is drawn again.`)) remake([], [lang]);
    e.target.value = '';
  });
  document.getElementById('carryOn')?.addEventListener('click', () => remake(null));
  document.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', async () => {
    try{
      await api(`/chat/video/${current.message_id}/version`, {method: 'POST', headers: JSON_HEADERS,
        body: JSON.stringify({lang: showing, file_id: Number(b.dataset.restore)})});
      await openStory(current.message_id);
      loadShelf();
    }catch(e){ showError(e.message); }
  }));
}

function renderGrid(){
  const told = story();
  const langs = languages();
  const first = langs[0];
  const grid = document.getElementById('grid');
  if(!grid || !told.pictures) return;
  grid.innerHTML = told.pictures.map((picture, i) => {
    const edited = !!edits[i];
    const words = edits[i]?.text?.[first] ?? (told[first] || [])[i] ?? '';
    const badges = langs.map(l => {
      const by = ((told.narration || {})[l] || [])[i]?.by;
      return by && by !== 'machine' ? `<span class="badge ${by}">${l.toUpperCase()} · ${BY[by] || by}</span>` : '';
    }).join('');
    return `<button type="button" class="scene-card ${i === open ? 'sel' : ''} ${edited ? 'edited' : ''}" data-i="${i}">
      <span class="pic">${picture ? `<img src="/chat/files/${picture}" alt="" loading="lazy">` : '<img alt="">'}
        <span class="n">${i + 1}</span>${edited ? '<span class="flag">changed</span>' : ''}</span>
      <span class="t" dir="auto">${escapeHtml(words)}</span>
      <span class="b">${badges || '<span class="badge">machine voice</span>'}</span></button>`;
  }).join('');
  grid.querySelectorAll('.scene-card').forEach(card => card.addEventListener('click', () => openDrawer(Number(card.dataset.i))));
}

// --- one scene, in the side panel -------------------------------------------------------------

function openDrawer(i){
  const told = story();
  const langs = languages();
  const editable = !current.being_made;
  open = i;
  const change = edits[i] || {};
  const drawer = document.getElementById('drawer');
  drawer.innerHTML = `<div class="head"><b>Scene ${i + 1} of ${told.pictures.length}</b>
      <button type="button" class="close" aria-label="Close">×</button></div>
    ${told.pictures[i] ? `<img src="/chat/files/${told.pictures[i]}" alt="Scene ${i + 1}">` : ''}
    <label class="check"><input type="checkbox" id="redraw" ${change.redraw ? 'checked' : ''} ${editable ? '' : 'disabled'}> Draw this picture again</label>
    <textarea class="describe" id="describe" ${change.redraw ? '' : 'hidden'} placeholder="What to draw (as before if left as it is)">${
      escapeHtml(change.picture ?? (told.drawn || [])[i] ?? '')}</textarea>
    ${langs.map(l => {
      const entry = ((told.narration || {})[l] || [])[i];
      const words = change.text?.[l] ?? (told[l] || [])[i] ?? '';
      return `<label class="field">${NAMES[l] || l}${entry ? `<span class="badge ${entry.by}">${BY[entry.by] || entry.by}</span>` : ''}</label>
        <textarea class="line ${change.text?.[l] !== undefined ? 'changed' : ''}" data-lang="${l}" lang="${l}" dir="auto"
          ${editable ? '' : 'readonly'}>${escapeHtml(words)}</textarea>
        ${entry?.by === 'recorded' ? `<div class="stale" ${change.text?.[l] !== undefined ? '' : 'hidden'}>Your reading of
          this line no longer fits; the machine voice reads it until you read it again.</div>` : ''}`;
    }).join('')}
    ${langs.length > 1 ? `<label class="check"><input type="checkbox" id="retranslate" ${change.retranslate ? 'checked' : ''}
      ${editable ? '' : 'disabled'}> Translate my change into the other language${langs.length > 2 ? 's' : ''}</label>` : ''}
    ${editable && told.pictures.length > 1 ? `<button type="button" class="btn btn-secondary" id="deleteScene"
      style="margin-top:1rem;border-color:#7f1d1d;color:#fca5a5">Delete this scene</button>` : ''}
    <div class="nav-row"><button type="button" class="btn btn-secondary" id="prev" ${i === 0 ? 'disabled' : ''}>‹ Scene ${i}</button>
      <button type="button" class="btn btn-secondary" id="next" ${i === told.pictures.length - 1 ? 'disabled' : ''}>Scene ${i + 2} ›</button></div>`;
  drawer.classList.add('open');
  drawer.querySelector('.close').addEventListener('click', closeDrawer);
  drawer.querySelector('img')?.addEventListener('click', e => {
    const zoom = document.getElementById('zoom');
    zoom.querySelector('img').src = e.target.src;
    zoom.showModal();
  });
  drawer.querySelector('#deleteScene')?.addEventListener('click', () => {
    if(!confirm(`Delete scene ${i + 1}? Every language's video is made again without it; nothing is drawn.`)) return;
    delete edits[i];
    remake(Object.entries(edits).map(([k, change]) => ({index: Number(k), ...change})), [], [i]);
  });
  drawer.querySelector('#prev').addEventListener('click', () => openDrawer(i - 1));
  drawer.querySelector('#next').addEventListener('click', () => openDrawer(i + 1));
  drawer.querySelector('#redraw').addEventListener('change', e => {
    drawer.querySelector('#describe').hidden = !e.target.checked;
    keep(i);
  });
  drawer.querySelector('#retranslate')?.addEventListener('change', () => keep(i));
  renderGrid();
}

// What the panel says now, kept for its scene while other scenes are opened
function keep(i){
  if(i !== open) return;
  const told = story();
  const drawer = document.getElementById('drawer');
  const change = {text: {}};
  drawer.querySelectorAll('.line').forEach(area => {
    const edited = clean(area.value) && clean(area.value) !== clean((told[area.dataset.lang] || [])[i]);
    area.classList.toggle('changed', !!edited);
    const stale = area.nextElementSibling;
    if(stale?.classList.contains('stale')) stale.hidden = !edited;
    if(edited) change.text[area.dataset.lang] = clean(area.value);
  });
  change.retranslate = !!drawer.querySelector('#retranslate')?.checked && Object.keys(change.text).length > 0;
  if(drawer.querySelector('#redraw').checked){
    change.redraw = true;
    const describe = drawer.querySelector('#describe').value.trim();
    if(describe && describe !== ((told.drawn || [])[i] || '').trim()) change.picture = describe;
  }
  if(Object.keys(change.text).length || change.redraw) edits[i] = change;
  else delete edits[i];
  updatePill();
  const card = document.querySelector(`.scene-card[data-i="${i}"]`);
  if(card){
    card.classList.toggle('edited', !!edits[i]);
    card.querySelector('.flag')?.remove();
    if(edits[i]) card.querySelector('.pic').insertAdjacentHTML('beforeend', '<span class="flag">changed</span>');
  }
}

function closeDrawer(){
  open = null;
  document.getElementById('drawer').classList.remove('open');
  document.querySelectorAll('.scene-card.sel').forEach(c => c.classList.remove('sel'));
}

function updatePill(){
  const count = Object.keys(edits).length;
  document.getElementById('pill').hidden = !count || busy;
  document.getElementById('pillText').textContent = `${count} scene${count === 1 ? '' : 's'} changed`;
}

// --- making it again --------------------------------------------------------------------------

function showProgress(event){
  document.getElementById('progress').hidden = false;
  if(event.step != null){
    const detail = event.stage && event.stage !== event.step_name ? `: ${event.stage}` : '';
    document.getElementById('partLine').textContent = `Part ${event.step} of ${event.steps} · ${event.step_name}${detail}`;
    document.getElementById('partBar').style.width = Math.round((event.part || 0) * 100) + '%';
  }else{
    document.getElementById('partLine').textContent = event.stage || '';
  }
  const whole = Math.round((event.fraction || 0) * 100);
  document.getElementById('wholeLine').textContent = `Overall ${whole}%`;
  document.getElementById('wholeBar').style.width = whole + '%';
}

// `list` the scenes changed (and `add` languages to add), or null to carry on with a video that
// stopped partway
async function remake(list, add = [], gone = []){
  if(list && !list.length && !add.length && !gone.length) return;
  showError('');
  busy = true;
  updatePill();
  closeDrawer();
  showProgress({stage: 'Starting', fraction: 0});
  let trouble = '';
  try{
    const response = list
      ? await fetch(`/chat/video/${current.message_id}/edit`, {method: 'POST', headers: JSON_HEADERS,
                                                             body: JSON.stringify({scenes: list, add_languages: add, delete: gone})})
      : await fetch(`/chat/video/${current.message_id}/continue`, {method: 'POST'});
    if(!response.ok){
      const err = await response.json().catch(() => ({}));
      throw new Error((typeof err.detail === 'string' && err.detail) || `HTTP ${response.status}`);
    }
    await readEvents(response, chunk => { if(chunk.gateway?.type === 'progress') showProgress(chunk.gateway); });
  }catch(e){
    trouble = 'It stopped: ' + e.message + '. What was made is kept.';
  }
  busy = false;
  document.getElementById('progress').hidden = true;
  edits = {};
  await openStory(current.message_id);
  if(trouble) showError(trouble);
  loadShelf();
}

document.getElementById('save').addEventListener('click', () =>
  remake(Object.entries(edits).map(([i, change]) => ({index: Number(i), ...change}))));
document.getElementById('drawer').addEventListener('input', () => { if(open !== null) keep(open); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && open !== null) closeDrawer(); });
window.addEventListener('beforeunload', e => { if(Object.keys(edits).length) e.preventDefault(); });

// After the page's own scripts (escapeHtml is defined after this block, in base.html)
document.addEventListener('DOMContentLoaded', () => loadShelf().catch(e => showError(e.message)));
</script>
{% endblock %}
